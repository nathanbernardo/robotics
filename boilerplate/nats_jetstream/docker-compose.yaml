services:
  nats:
    container_name: nats-server
    image: nats:2.10.9-alpine3.19
    ports:
      - "4222:4222" # Client connection port
      - "8222:8222" # HTTP monitoring port
    command:
      - "--js" # Enable JetStream
      - "--sd=/data" # Set storage directory
      - "--http_port=8222" # Monitoring endpoint
      - "--name=nats-server" # Server name
      - "--cluster_name=local-cluster" # Cluster nam

